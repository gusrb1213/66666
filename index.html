<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>마감 06:00</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/quiple/galmuri@1.1/dist/galmuri.css">
<style>
:root{
 --bg:#05060d;--p1:#151b38;--p2:#0b0f24;--line:#2a3366;--hi:#5c86d6;
 --tx:#eef1ff;--dm:#8b93c4;--fa:#ff5468;--wa:#ffc94d;--sa:#5be38f;--in:#7fc8ff;--gold:#ffd863;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.px{font-family:'Galmuri11','IBM Plex Sans KR',monospace}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.hide{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* 화면 효과 */
.scan{position:fixed;inset:0;pointer-events:none;z-index:45;opacity:.35;
 background:repeating-linear-gradient(180deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px)}
.vig{position:fixed;inset:0;pointer-events:none;z-index:44;
 background:radial-gradient(ellipse at 50% 40%,transparent 50%,rgba(0,0,0,.65) 100%)}
body.crit .vig{animation:pulse 1s infinite;
 background:radial-gradient(ellipse at 50% 40%,transparent 40%,rgba(255,30,60,.45) 100%)}
@keyframes pulse{0%,100%{opacity:.55}15%{opacity:1}30%{opacity:.6}45%{opacity:.9}}
.shake{animation:shk .45s}
@keyframes shk{0%,100%{transform:none}20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,3px)}80%{transform:translate(3px,-1px)}}

/* 앱 프레임 */
.app{max-width:430px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative;z-index:1;
 background:linear-gradient(180deg,#0a0e22,#05060d)}
section{flex:1;display:flex;flex-direction:column;min-height:0;padding:14px 14px 12px}

/* 홈 */
.home{justify-content:center;text-align:center}
.bigclk{font-size:76px;font-weight:700;color:var(--fa);letter-spacing:-.02em;line-height:1;
 text-shadow:0 0 22px rgba(255,84,104,.6);animation:flick 2.4s infinite}
@keyframes flick{0%,100%{opacity:1}48%{opacity:1}50%{opacity:.4}52%{opacity:1}}
.bigclk .cl{animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.ttl{font-size:26px;margin:14px 0 6px;letter-spacing:.04em}
.sub{font-size:12.5px;color:var(--dm);margin-bottom:28px}
.chap{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;margin-bottom:12px;border-radius:16px;
 background:linear-gradient(160deg,var(--p1),var(--p2));border:1px solid var(--line);
 box-shadow:0 8px 20px rgba(0,0,0,.4)}
.chap:active{transform:scale(.98)}
.chap .ic{font-size:32px;width:52px;height:52px;display:grid;place-items:center;border-radius:14px;background:rgba(127,200,255,.08)}
.chap b{display:block;font-size:15px}
.chap small{color:var(--dm);font-size:11.5px}
.chap .go{margin-left:auto;color:var(--fa);font-size:20px}

/* 튜토리얼 카드 */
.how{justify-content:center;text-align:center}
.hc{padding:22px 16px;border-radius:18px;background:linear-gradient(160deg,var(--p1),var(--p2));border:1px solid var(--line);margin-bottom:12px}
.hc .e{font-size:42px}
.hc b{display:block;font-size:16px;margin:8px 0 4px}
.hc span{font-size:12.5px;color:var(--dm)}
.dots{display:flex;gap:6px;justify-content:center;margin:6px 0 18px}
.dots i{width:7px;height:7px;border-radius:9px;background:var(--line)}
.dots i.on{background:var(--fa);width:20px}

/* 채점기준 */
.rub{padding:16px;border-radius:16px;background:linear-gradient(160deg,var(--p1),var(--p2));border:1px solid var(--line);text-align:left}
.rh{font-size:12px;color:var(--gold);margin:14px 0 8px;letter-spacing:.04em}
.rh:first-child{margin-top:0}
.goal{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:rgba(127,200,255,.08);margin-bottom:6px;font-size:13.5px}
.goal b.n{font-size:18px;color:var(--in)}
.rb{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:12px}
.rb .rl{flex:0 0 108px;color:var(--dm)}
.rb .rbar{flex:1;height:8px;border-radius:9px;background:#0a0f26;overflow:hidden}
.rb .rbar i{display:block;height:100%;background:linear-gradient(90deg,var(--in),var(--sa));border-radius:9px}
.rb .rv{flex:0 0 46px;text-align:right;font-weight:700}
.rb.zero .rl,.rb.zero .rv{color:var(--fa)}
.warn1{display:flex;gap:8px;padding:9px 12px;border-radius:10px;background:rgba(255,84,104,.1);border:1px solid rgba(255,84,104,.3);
 color:#ffb3bb;font-size:12.5px;margin-bottom:6px}

/* HUD */
.hud{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.timer{flex:1;display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:12px;background:rgba(255,84,104,.08);border:1px solid rgba(255,84,104,.35)}
.timer .lb{font-size:9px;letter-spacing:.2em;color:var(--fa)}
.timer .t{font-size:30px;font-weight:700;color:var(--tx);text-shadow:0 0 10px rgba(255,84,104,.5)}
body.crit .timer{background:rgba(255,84,104,.25);border-color:var(--fa)}
body.crit .timer .t{color:var(--fa);animation:bl .5s steps(1) infinite}
.chip{padding:8px 10px;border-radius:12px;background:var(--p1);border:1px solid var(--line);font-size:13px;white-space:nowrap}
.chip b{color:var(--gold)}
.ib{width:40px;height:40px;border-radius:12px;background:var(--p1);border:1px solid var(--line);font-size:17px;position:relative}
.ib .dot{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:9px;background:var(--fa);box-shadow:0 0 6px var(--fa)}
.bar{height:5px;border-radius:9px;background:#0a0f26;overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--in),var(--tx));transition:width .15s linear}
body.crit .bar i{background:linear-gradient(90deg,var(--fa),#ffb0b8)}

.stages{display:flex;gap:6px;margin-bottom:10px}
.stg{flex:1;padding:7px 4px;border-radius:10px;background:var(--p2);border:1px solid var(--line);font-size:11px;color:var(--dm);text-align:center}
.stg small{display:block;font-size:10px;opacity:.8}
.stg.on{background:linear-gradient(160deg,#3a2030,#1c1024);border-color:var(--fa);color:var(--tx)}
.stg.lk{opacity:.4}
.tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
.tab{flex:1;min-width:58px;padding:7px 4px;border-radius:10px;background:var(--p2);border:1px solid var(--line);font-size:11px;color:var(--dm);text-align:center;position:relative}
.tab .e{display:block;font-size:17px}
.tab.on{background:var(--p1);border-color:var(--hi);color:var(--tx)}
.tab .dot{position:absolute;top:4px;right:6px;width:7px;height:7px;border-radius:9px;background:var(--fa)}

.body{flex:1;overflow-y:auto;min-height:0;padding:2px}
.card{padding:13px 14px;border-radius:14px;background:linear-gradient(160deg,var(--p1),var(--p2));border:1px solid var(--line);margin-bottom:10px;font-size:13.5px;line-height:1.7}
.card .lab{font-size:10px;color:var(--dm);letter-spacing:.12em;margin-bottom:6px}
.card h3{margin:0 0 6px;font-size:16px}
.u{cursor:pointer;border-radius:4px;padding:1px 2px;margin:0 -2px}
.u:active{background:rgba(127,200,255,.18)}
.u.pin{background:rgba(255,201,77,.18);box-shadow:inset 0 -2px 0 var(--wa)}
.u.ev{background:rgba(127,200,255,.16);box-shadow:inset 0 -2px 0 var(--in)}
.u.fx{background:rgba(91,227,143,.14);box-shadow:inset 0 -2px 0 var(--sa)}
.u.er{background:rgba(255,84,104,.16);box-shadow:inset 0 -2px 0 var(--fa)}
.tbl{width:100%;border-collapse:collapse;font-size:11.5px}
.tbl td,.tbl th{border:1px solid rgba(140,160,220,.25);padding:5px 7px;text-align:left}
.tbl th{color:var(--dm);font-weight:500}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.meta span{font-size:11px;padding:3px 8px;border-radius:9px;background:rgba(127,200,255,.1);color:var(--in)}
.cap{font-size:11px;color:var(--dm);margin-top:5px}

.foot{display:flex;gap:8px;padding-top:10px}
.btn{flex:1;padding:14px;border-radius:14px;font-weight:700;font-size:15px;
 background:linear-gradient(160deg,#ff5468,#b8243a);box-shadow:0 6px 18px rgba(255,84,104,.35)}
.btn.b2{background:linear-gradient(160deg,#4a6cbe,#1c2c60);box-shadow:0 6px 18px rgba(74,108,190,.3)}
.btn.g{background:var(--p1);border:1px solid var(--line);box-shadow:none;font-weight:500;font-size:13px;color:var(--dm);flex:0 0 auto;padding:14px 16px}
.btn:active{transform:translateY(1px)}

/* 채팅 */
.msg{display:flex;gap:8px;margin-bottom:9px;align-items:flex-end}
.av{flex:0 0 30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--hi)}
.bub{padding:8px 12px;border-radius:14px 14px 14px 4px;background:var(--p1);border:1px solid var(--line);font-size:12.5px;line-height:1.5;max-width:80%}
.bub .nm{display:block;font-size:10px;color:var(--gold)}
.msg.me{flex-direction:row-reverse}
.msg.me .bub{border-radius:14px 14px 4px 14px;background:#22305e}
.ask{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:10px 12px;border-radius:12px;background:var(--p2);border:1px dashed var(--line);margin-bottom:7px;font-size:12px}
.ask:disabled{opacity:.35}
.ask .c{margin-left:auto;color:var(--wa);font-size:11px;white-space:nowrap}

/* 시트 */
.sheet{position:fixed;inset:0;background:rgba(2,3,10,.75);display:flex;align-items:flex-end;z-index:50}
.sin{width:100%;max-width:430px;margin:0 auto;max-height:86dvh;overflow-y:auto;padding:16px 16px 22px;
 border-radius:20px 20px 0 0;background:linear-gradient(180deg,#151b38,#070a1a);border-top:1px solid var(--hi);animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sq{font-size:14px;line-height:1.6;padding:12px 13px;border-radius:12px;background:rgba(0,0,0,.3);border-left:3px solid var(--wa);margin-bottom:12px}
.sh{font-size:12px;color:var(--gold);margin:14px 0 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.kc{display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 6px;border-radius:12px;background:var(--p1);border:1px solid var(--line);font-size:12.5px}
.kc .e{font-size:22px}
.kc:active{border-color:var(--wa)}
.kc.full{grid-column:1/-1;flex-direction:row;justify-content:center;color:var(--dm)}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.tl{padding:11px 4px;border-radius:12px;background:var(--p1);border:1px solid var(--line);text-align:center;font-size:11.5px}
.tl .e{display:block;font-size:22px}
.tl .c{display:block;color:var(--wa);font-size:10.5px;margin-top:2px}
.fx{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:11px 12px;border-radius:12px;background:var(--p1);border:1px solid var(--line);margin-bottom:7px;font-size:13px}
.fx .c{margin-left:auto;color:var(--wa);font-size:11px}
.fx small{display:block;color:var(--dm);font-size:11px}
.status{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;font-size:12.5px;margin-bottom:8px}
.status.no{background:rgba(255,84,104,.1);border:1px solid rgba(255,84,104,.35);color:#ffb3bb}
.status.ok{background:rgba(91,227,143,.1);border:1px solid rgba(91,227,143,.35);color:#b8f5cf}
.evb{padding:12px;border-radius:12px;background:rgba(0,0,0,.3);border:1px solid rgba(127,200,255,.4);margin-bottom:10px;font-size:12.5px}
.evb .t{font-size:10px;letter-spacing:.14em;color:var(--in);margin-bottom:8px}
.er2{display:flex;gap:8px;margin-bottom:5px;align-items:center}
.er2 .d{width:8px;height:8px;border-radius:9px;flex:0 0 8px}
.er2 .k{flex:0 0 110px;color:var(--dm);font-size:11.5px}

/* 교수 오버레이 */
.ov{position:fixed;inset:0;z-index:70;background:rgba(5,0,6,.82);display:flex;align-items:center;justify-content:center;padding:20px}
.ovin{width:100%;max-width:380px;text-align:center;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.prof{width:130px;height:130px;filter:drop-shadow(0 8px 20px rgba(0,0,0,.6))}
.prof.mad{animation:mad .25s infinite}
@keyframes mad{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) scale(1.03)}}
.steam{animation:stm .8s infinite}
@keyframes stm{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-6px)}}
.bubble{position:relative;margin:14px 0 18px;padding:16px;border-radius:16px;background:#fff;color:#111;font-size:16px;line-height:1.5}
.bubble::before{content:"";position:absolute;top:-10px;left:50%;margin-left:-10px;border:10px solid transparent;border-top:0;border-bottom-color:#fff}
.ovin.angry .bubble{background:#ffe1e4;color:#7a0010;font-size:18px;font-weight:700;border:3px solid var(--fa)}
.ovin.angry .bubble::before{border-bottom-color:var(--fa)}
.peek{position:fixed;right:-160px;bottom:110px;z-index:55;display:flex;align-items:flex-end;gap:6px;transition:right .4s cubic-bezier(.2,1.2,.4,1)}
.peek.on{right:8px}
.peek .prof{width:70px;height:70px}
.peek .pb{max-width:170px;padding:9px 11px;border-radius:12px;background:#fff;color:#111;font-size:12px;line-height:1.4}

.banner{position:fixed;left:0;right:0;top:40%;z-index:60;text-align:center;font-size:22px;font-weight:700;
 padding:14px;background:linear-gradient(90deg,transparent,rgba(255,84,104,.9),transparent);opacity:0;pointer-events:none}
.banner.on{animation:bn 1.8s ease-out}
@keyframes bn{0%{opacity:0;transform:scaleY(0)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;padding:10px 16px;border-radius:999px;
 background:#1c2550;border:1px solid var(--hi);font-size:12.5px;opacity:0;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{animation:ts 2.2s ease-out}
@keyframes ts{0%{opacity:0;transform:translateX(-50%) translateY(8px)}12%{opacity:1;transform:translateX(-50%)}82%{opacity:1}100%{opacity:0}}

/* 결과 */
.end{overflow-y:auto}
.grade{text-align:center;padding:14px 0}
.grade .g{font-size:64px;font-weight:700;line-height:1;text-shadow:0 0 22px currentColor}
.grade .s{font-size:12.5px;color:var(--dm);margin-top:8px}
.pq{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.pq .prof{width:44px;height:44px;flex:0 0 44px}
.pq .pqb{flex:1;padding:10px 12px;border-radius:4px 14px 14px 14px;background:#fff;color:#111;font-size:12.5px;line-height:1.5}
.pq.bad .pqb{background:#ffe1e4;color:#7a0010}
.row{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:12px}
.row .l{flex:0 0 96px;color:var(--dm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .b{flex:1;height:7px;border-radius:9px;background:#0a0f26;overflow:hidden}
.row .b i{display:block;height:100%;border-radius:9px}
.row .v{flex:0 0 36px;text-align:right;color:var(--dm)}
.rv{display:flex;gap:8px;align-items:center;padding:9px 11px;border-radius:10px;background:var(--p2);margin-bottom:6px;font-size:12px}
.rv .e{font-size:16px}
.rv .l{flex:0 0 90px;color:var(--dm)}

/* CH.2 원문 대조 */
.src{display:flex;flex-wrap:wrap;gap:6px}
.sc{padding:6px 10px;border-radius:9px;background:rgba(127,200,255,.08);border:1px solid var(--line);font-size:12px;transition:.2s}
.sc.hit{background:rgba(255,201,77,.2);border-color:var(--wa);transform:scale(1.06)}
.ais{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:12px;background:var(--p1);border:1px solid var(--line);margin-bottom:7px;font-size:13.5px;line-height:1.5}
.ais.ok{border-color:var(--sa);background:rgba(91,227,143,.08)}
.ais.no{border-color:var(--fa);background:rgba(255,84,104,.08)}
.ais .w{display:block;font-size:11.5px;color:var(--dm);margin-top:4px}
.vs{text-align:center;font-size:11px;color:var(--fa);letter-spacing:.3em;margin:10px 0}
</style>
</head>
<body>
<div class="vig"></div><div class="scan"></div>
<div class="app" id="app">

<!-- 홈 -->
<section id="scHome" class="home">
  <div class="bigclk mono">06<span class="cl">:</span>00</div>
  <div class="ttl px">마감 직전</div>
  <div class="sub">교양 팀플 최종본. 제출 버튼까지 남은 시간.</div>
  <button class="chap" id="goCh1"><span class="ic">📁</span><span><b>CH.1 최종 점검</b><small>3 스테이지 · 6분</small></span><span class="go">▶</span></button>
  <button class="chap" id="goCh2"><span class="ic">🤖</span><span><b>CH.2 원문 대조</b><small>AI 요약 vs 원자료 · 1분 30초</small></span><span class="go">▶</span></button>
</section>

<!-- 튜토리얼 -->
<section id="scHow" class="how hide">
  <div id="howCard"></div>
  <div class="dots" id="howDots"></div>
  <button class="btn" id="howNext">다음</button>
</section>

<!-- 채점기준 -->
<section id="scBrief" class="hide" style="justify-content:center">
  <div class="ttl px" style="text-align:center;margin-top:0">📋 교수님 채점 기준</div>
  <div class="sub" style="text-align:center;margin-bottom:14px">게임 중에도 📋 버튼으로 다시 볼 수 있다</div>
  <div id="briefRub"></div>
  <div class="foot"><button class="btn" id="btnStart">파일 열기 ▶</button></div>
</section>

<!-- CH.1 게임 -->
<section id="scGame" class="hide">
  <div class="hud">
    <div class="timer"><span class="lb">DEAD<br>LINE</span><span class="t mono" id="clk">6:00</span></div>
    <div class="chip">🤝 <b class="mono" id="trN">80</b></div>
    <button class="ib" id="btnRub">📋</button>
    <button class="ib" id="btnSnd">🔊</button>
  </div>
  <div class="bar"><i id="lnf" style="width:100%"></i></div>
  <div class="stages" id="stages"></div>
  <div class="tabs" id="tabs"></div>
  <div class="body" id="body"></div>
  <div class="foot" id="foot"></div>
</section>

<!-- CH.1 결과 -->
<section id="scEnd" class="end hide">
  <div class="grade"><div class="g px" id="eG"></div><div class="s" id="eS"></div></div>
  <div class="sh">교수님 코멘트</div><div id="eQ"></div>
  <div class="sh">시간을 쓴 곳</div><div id="eT"></div>
  <div class="sh">항목별 복기</div><div id="eRev"></div>
  <div class="sh">팀 분위기</div><div id="eTeam"></div>
  <div class="foot"><button class="btn g" onclick="location.reload()">🏠 홈</button><button class="btn" onclick="location.reload()">다시 도전</button></div>
</section>

<!-- CH.2 원문 대조 -->
<section id="scDiff" class="hide">
  <div class="hud">
    <div class="timer"><span class="lb">TIME</span><span class="t mono" id="dClk">1:30</span></div>
    <div class="chip">✔ <b class="mono" id="dScore">0</b>/5</div>
  </div>
  <div class="bar"><i id="dLn" style="width:100%"></i></div>
  <div class="body">
    <div class="card"><div class="lab">📊 원자료 (설문 결과)</div><div class="src" id="src"></div></div>
    <div class="vs px">VS</div>

const STAGES=[

/* ── 긴박감 이벤트 ── */
const EVENTS=[
 {at:300,chat:['서진','다들 어디까지 봤어?']},
 {at:240,chat:['도윤','아직 1스테이지면 큰일이다…']},
 {at:180,banner:'⚠ 3분 남음',chat:['하린','교수님 메일함 벌써 열려있대 😱']},

/* ── 상태 ── */
let stage=0,maxStage=0,tab='slides',trust=80,ended=false,cur=null;
let t0=0,elapsedBase=0,left=TOTAL,tick=null,lastSec=999;
let pin={},ev={},fix={},spent={},read={},asked={},pending=[],fired={};
const chatLog=[];

$('btnStart').onclick=()=>{
 initAudio();show('scGame');renderStage();
 t0=Date.now();

};
$('btnRub').onclick=()=>openSheet(`<div class="ttl px" style="font-size:18px;margin:0 0 10px">📋 채점 기준</div>${rubHTML()}
 <div class="foot"><button class="btn b2" onclick="closeSheet()">닫기</button></div>`);
$('btnSnd').onclick=()=>{snd=!snd;$('btnSnd').textContent=snd?'🔊':'🔇';};

function computeLeft(){left=Math.max(0,TOTAL-((Date.now()-t0)/1000+elapsedBase));}
function loop(){
 computeLeft();clockPaint();
 EVENTS.forEach((e,i)=>{
  if(fired[i]||left>e.at)return; fired[i]=1;
  if(e.chat){chatLog.push({who:e.chat[0],txt:e.chat[1]});toast(`💬 ${e.chat[0]}: ${e.chat[1]}`);markChat();}
  if(e.banner){banner(e.banner);shake();}
  if(e.crit)document.body.classList.add('crit');
  if(e.peek)profPeek(e.peek);
 });
 for(let i=pending.length-1;i>=0;i--){
  if(left<=pending[i].at){const p=pending.splice(i,1)[0];
   chatLog.push({who:p.who,txt:p.txt});ev[p.gives]=1;toast(`💬 ${p.who}이 답장했다`);markChat();if(tab==='chat')paint();}
 }
 const s=Math.ceil(left);
 if(s!==lastSec){lastSec=s; if(left<=60&&left>0) beep(left<=10?1250:720,.06,left<=10?.1:.06);}
 if(left<=0)finish(true);
}
function clockPaint(){
 const m=Math.floor(left/60),s=Math.floor(left%60);
 $('clk').textContent=`${m}:${String(s).padStart(2,'0')}`;
 $('lnf').style.width=(left/TOTAL*100)+'%';
}
function spend(sec,key){elapsedBase+=sec;if(key)spent[key]=(spent[key]||0)+sec;computeLeft();clockPaint();if(left<=0)finish(true);}
function setTrust(d){trust=Math.max(0,Math.min(100,trust+d));$('trN').textContent=Math.round(trust);}
function markChat(){const d=document.querySelector('[data-d="chat"] .dot');if(d&&tab!=='chat')d.classList.remove('hide');}

/* ── 스테이지/탭 ── */
function renderStage(){
 $('stages').innerHTML=STAGES.map((s,i)=>`<button class="stg ${i===stage?'on':''} ${i>maxStage?'lk':''}" data-s="${i}">
  ${i<maxStage&&i!==stage?'✓ ':i>maxStage?'🔒 ':''}${s.n}<small>${s.t}</small></button>`).join('');
 $('stages').querySelectorAll('.stg').forEach(b=>b.onclick=()=>{
  const i=+b.dataset.s; if(i>maxStage){toast('🔒 앞 스테이지를 먼저 넘겨야 한다');return;}
  stage=i;tab=STAGES[i].docs[0];renderStage();});
 const tabs=[...STAGES[stage].docs,'archive','chat'];
 if(!tabs.includes(tab))tab=tabs[0];
 $('tabs').innerHTML=tabs.map(d=>`<button class="tab ${d===tab?'on':''}" data-d="${d}"><span class="e">${DOCS[d].e}</span>${DOCS[d].n}
  ${d==='chat'?'<span class="dot hide"></span>':''}</button>`).join('');
 $('tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.d;renderStage();});
 $('foot').innerHTML = stage<STAGES.length-1
  ? `<button class="btn g" id="subNow">📤 바로 제출</button><button class="btn b2" id="nextS">다음 스테이지 ▶</button>`
  : `<button class="btn" id="subNow">📤 제출하기</button>`;
 $('subNow').onclick=()=>finish(false);
 if($('nextS'))$('nextS').onclick=()=>{stage++;maxStage=Math.max(maxStage,stage);tab=STAGES[stage].docs[0];
  banner(`${STAGES[stage].n} · ${STAGES[stage].t}`);renderStage();};
 paint();
}
function paint(){
 read[tab]=1;

 if(d.chat){$('body').innerHTML=chatHTML();bindChat();document.querySelector('[data-d="chat"] .dot')?.classList.add('hide');return;}
 $('body').innerHTML=d.r();
 $('body').querySelectorAll('.u').forEach(el=>{
  const k=el.dataset.n;
  if(fix[k])el.classList.add(fix[k].wrong?'er':'fx');else if(pin[k]&&ev[k])el.classList.add('ev');else if(pin[k])el.classList.add('pin');

 });

  :`<div class="msg"><div class="av">${c.who[0]}</div><div class="bub"><span class="nm">${c.who}</span>${c.txt}</div></div>`).join('')

  +PEOPLE.map((p,i)=>`<button class="ask" data-p="${i}" ${asked[p.id]?'disabled':''}>💬 ${p.id}: ${p.q}<span class="c">🤝-2</span></button>`).join('');

function openItem(k){

 return `<div class="evb"><div class="t">${e.c==='ok'?'✅':'🧾'} ${e.t}</div>

function drawItem(){

 }else if(!pin[k]){
  h+=`<div class="sh">무엇이 문제일까?</div><div class="grid">
   ${n.cand.map(c=>`<button class="kc" data-k="${c}"><span class="e">${KINDS[c].e}</span>${KINDS[c].t}</button>`).join('')}

 }else{
  h+=`<div class="status" style="background:rgba(255,201,77,.1);border:1px solid rgba(255,201,77,.35)">${KINDS[pin[k]].e} 내 판단: <b>${KINDS[pin[k]].t}</b>
   <button style="margin-left:auto;color:var(--dm);font-size:11px" data-re="1">다시 고르기</button></div>`;
  if(ev[k]){h+=`<div class="status ok">🧾 증거 확보</div>`+evHTML(n);}
  else{
   h+=`<div class="status no">🔓 아직 증거 없음 — 고치면 효과 ↓</div>
    <div class="sh">증거 찾기</div><div class="tools">
    ${Object.entries(TOOLS).map(([tk,t])=>`<button class="tl" data-t="${tk}"><span class="e">${t.e}</span>${t.n}<span class="c">-${t.c}초</span></button>`).join('')}</div>`;
   if(n.needRead)h+=`<div class="cap" style="margin-top:8px">💡 도구 말고 🗄 자료실에 답이 있을지도.</div>`;
  }
  h+=`<div class="sh">어떻게 고칠까?</div>
   ${n.fx.map((f,i)=>`<button class="fx" data-f="${i}"><span>${f.n}${f.d?`<small>${f.d}</small>`:''}</span><span class="c">${f.c?'-'+f.c+'초':''}</span></button>`).join('')}
   <button class="fx" data-cancel="1" style="color:var(--dm)">↩ 지목 취소</button>`;
 }
 const s=openSheet(h);
 s.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{
  if(b.dataset.k==='none'){closeSheet();return;}
  pin[k]=b.dataset.k;
  if(n.always)ev[k]=1;
  if(n.needRead&&read[n.needRead])ev[k]=1;
  drawItem();paint();});
 s.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>useTool(b.dataset.t));
 s.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>doFix(+b.dataset.f));
 s.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{delete pin[k];closeSheet();paint();});
 s.querySelectorAll('[data-re]').forEach(b=>b.onclick=()=>{delete pin[k];drawItem();paint();});
}
function useTool(tk){
 const k=cur,n=N[k];spend(TOOLS[tk].c,k);if(ended)return;
 if(n.tool===tk){ev[k]=1;toast('🧾 증거를 확보했다');beep(980,.08);if(k==='axis')ev.gen=1;}
 else toast('🤷 이 도구로는 나오는 게 없다');
 drawItem();paint();
}
function doFix(i){
 const k=cur,n=N[k],f=n.fx[i];
 spend(f.c,k);if(f.t)setTrust(f.t);if(ended)return;
 if(f.keep){delete pin[k];closeSheet();paint();return;}
 fix[k]={n:f.n,q:f.q,wrong:!!f.wrong,ev:!!ev[k],kind:pin[k]};
 if(f.wrong){toast('😬 멀쩡한 걸 건드렸다');shake();}else toast('✅ 수정 완료');

/* ── 제출 ── */
let RES=null;
function finish(auto){
 if(ended)return;ended=true;clearInterval(tick);closeSheet();document.body.classList.remove('crit');
 let sc=76,qa=[];
 if(auto){sc-=4;qa.push({bad:1,t:'마감을 넘겼습니다. 지각 제출로 처리합니다.'});}
 Object.entries(N).forEach(([k,n])=>{
  const f=fix[k];
  if(n.sev==='정상'){if(f){sc-=6;qa.push({bad:1,t:'멀쩡한 부분을 왜 뺐죠? 그건 문제가 없었는데요.'});}else sc+=2;return;}
  if(f){
   const kOK=f.kind===n.kind;let g=f.q;if(!kOK)g*=.6;if(!f.ev)g*=.6;sc+=g;
   if(!f.ev&&Math.random()<.45)qa.push({t:qLine(k)+' (근거를 대지 못했다)'});
   else if(!kOK)qa.push({t:'고치긴 했는데, 왜 문제였는지는 설명이 안 되네요.'});
   return;
  }
  if(Math.random()<n.exp){sc-=n.w;qa.push({bad:n.sev==='치명',t:qLine(k)});}else sc-=n.w*.3;
 });
 sc=Math.max(0,Math.min(100,Math.round(sc)));
 RES={sc,qa};
 if(auto)profPop('angry','6분 지났습니다!!<br>지각 제출은 감점이에요!','😰 결과 확인',showEnd);
 else profPop('calm','제출 확인했습니다.<br>한번 볼까요?','결과 보기',showEnd);
}
function qLine(k){return {

 typo:'표지 과목명부터 틀렸네요.'}[k]||'이 부분 설명해 보세요.';}
function showEnd(){
 show('scEnd');
 const {sc,qa}=RES;

 $('eS').textContent=`${sc}점 · 교수님 질문 ${qa.length}건 · 🤝 ${Math.round(trust)}`;
 if(!qa.length)qa.push({ok:1,t:'근거 범위를 스스로 밝힌 점이 좋았습니다.'});

 const rows=Object.keys(N).map(k=>({k,n:N[k],t:spent[k]||0})),mx=Math.max(35,...rows.map(r=>r.t));
 $('eT').innerHTML=rows.map(r=>{const c=r.n.sev==='치명'?'var(--fa)':r.n.sev==='중요'?'var(--wa)':r.n.sev==='정상'?'var(--in)':'#4a5680';
  return `<div class="row"><span class="l">${LABEL[r.k]}</span><span class="b"><i style="width:${r.t/mx*100}%;background:${c}"></i></span><span class="v">${r.t?Math.round(r.t)+'s':'—'}</span></div>`;}).join('')
  +`<div class="cap">🔴 치명 🟡 중요 🔵 사실 정상이던 항목</div>`;

  const f=fix[k];let e,s;

const DTOT=90;let dLeft=DTOT,dT0=0,dTick=null,dAns={},dEnded=false,dLast=999;
$('goCh2').onclick=()=>{

function dFinish(auto){
 if(dEnded)return;dEnded=true;clearInterval(dTick);closeSheet();document.body.classList.remove('crit');
 const sc=Object.values(dAns).filter(v=>v.ok).length;
 const go=()=>{
  show('scDiffEnd');
  $('dG').textContent=`${sc} / 5`;$('dG').style.color=sc>=4?'var(--sa)':sc>=3?'var(--wa)':'var(--fa)';
  $('dS').textContent=auto?'시간 초과':'판정 완료';
  const msg=sc===5?'AI 요약을 원자료와 한 줄씩 대조했군요. 완벽합니다.'
   :sc>=3?'대부분 잡았지만, AI는 그럴듯하게 틀립니다. 원자료와 끝까지 대조하세요.'
   :'AI 요약을 그대로 믿으면 이렇게 됩니다. 원자료부터 보세요.';
  $('dQ').innerHTML=`<div class="pq ${sc<3?'bad':''}">${profSVG(sc<3?'angry':'calm')}<div class="pqb">${msg}</div></div>`;
  $('dRev').innerHTML=AIS.map((a,i)=>`<div class="rv"><span class="e">${dAns[i]?(dAns[i].ok?'✅':'❌'):'⏱'}</span>
   <span style="flex:1">${a.t}<br><span style="color:var(--dm)">${DT[a.a].e} ${DT[a.a].t} — ${a.why}</span></span></div>`).join('');
 };
 if(auto)profPop('angry','시간 끝!<br>AI 요약 검토가 아직이잖아요!','😰 결과 확인',go);else go();
}
</script>
</body>
</html>
